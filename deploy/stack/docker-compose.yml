# AI-storyboard 一体化部署栈（单 compose 文件）
#
# 一个 compose 项目拉起完整业务栈：Postgres / Redis / MinIO / MoonSandbox
# + 6 个 Java 服务（api-gateway、backend、llm-gateway、moon-agent、asset-service、canvas）
# + 前端入口（主站 `/` 与画布站 `/canvas/`）。
#
# 本地/目标机都用同一份文件：
#   docker compose --env-file .env up -d --build      # 有源码与构建环境
#   docker compose --env-file .env up -d --no-build   # 目标机（已 docker load 离线镜像）
#   或直接：bash scripts/load-and-up.sh
#
# 数据全部落在本目录内，随目录一起迁移：
#   ./data/minio                MinIO 对象（历史图片/视频/文档）
#   ./data/sandbox-workspaces   Agent 沙箱工作区（会话产出、skills、overflow）
#   Postgres / Redis / uploads  命名卷（${STACK_PREFIX}-pgdata 等）
#
# 相对 deploy/stack 旧版的差别（2026-10-20）：
#   1. 容器名、网络名全部带 ${STACK_PREFIX} 前缀，同一台机器可并存多套；
#   2. 去掉固定 IP / 固定 subnet，改用 compose 服务名 DNS（不再和宿主已有网段冲突）；
#   3. MinIO 与沙箱数据从外部目录/命名卷改为本目录 ./data/**，整包可拷；
#   4. 沙箱（runner + 出网代理）常驻，不再是可选 profile；
#   5. 每个容器都有可覆盖的内存上限，避免 JVM 按宿主机内存算堆；
#   6. 透传 X-Forwarded-* + 可配置 PUBLIC_ORIGIN，修掉经 nginx 访问时的 CORS 误判。
name: ${COMPOSE_PROJECT_NAME:-aistoryboard}

x-java-base: &java-base
  restart: unless-stopped
  environment: &java-base-env
    TZ: ${TZ:-Asia/Shanghai}
    SPRING_PROFILES_ACTIVE: prod
    # 经 nginx 反代时按 X-Forwarded-* 还原真实 scheme/host/port。
    # 少了它，画布的 POST/PATCH/PUT 会被当成跨域并静默 403（Invalid CORS request）。
    SERVER_FORWARD_HEADERS_STRATEGY: framework
    # 浏览器实际访问地址 + 本机回环；PUBLIC_ORIGIN 必须与地址栏一致。
    CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost},http://localhost,http://127.0.0.1
    # 服务发现默认关闭：不注册，网关按下面的直连地址路由。
    NACOS_DISCOVERY_ENABLED: ${NACOS_DISCOVERY_ENABLED:-false}
    NACOS_ADDR: ${NACOS_ADDR:-nacos:8848}
    # ApiGateway 上游直连地址（换端口/域名只改 .env）
    BACKEND_URI: ${BACKEND_URI:-http://backend:8082}
    ASSET_SERVICE_URI: ${ASSET_SERVICE_URI:-http://asset-service:8085}
    CANVAS_URI: ${CANVAS_URI:-http://canvas:9090}
    MOON_AGENT_URI: ${MOON_AGENT_URI:-http://moon-agent:8084}
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    INTERNAL_SECRET: ${INTERNAL_SECRET}
    JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    JWT_ISSUER: ${JWT_ISSUER:-ai-storyboard-backend}
    STORYBOARD_INTERNAL_URL: http://backend:8082
    ASSET_SERVICE_URL: http://asset-service:8085
    LLM_GATEWAY_BASE_URL: http://llm-gateway:8083
    STORYBOARD_STORAGE_ENDPOINT: http://minio:9000
    STORYBOARD_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
    STORYBOARD_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    STORYBOARD_STORAGE_BUCKET: storyboard
    STORYBOARD_STORAGE_REGION: us-east-1
    # 媒体引用额外允许的 origin（默认空）；浏览器同源地址走路径归一化，无需登记
    MOON_MEDIA_ALLOWED_ORIGINS: ${MOON_MEDIA_ALLOWED_ORIGINS:-}
    FILE_SIGNING_SECRET: ${INTERNAL_SECRET}
    JAVA_TOOL_OPTIONS: >-
      -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      -Djava.security.egd=file:/dev/./urandom -Duser.timezone=${TZ:-Asia/Shanghai}

x-db-env: &db-env
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ai_storyboard
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

services:
  # ── 基础设施 ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:18-alpine
    container_name: ${STACK_PREFIX:-aistoryboard}-postgres
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=120
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - wal_compression=on
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # postgres:18 的 PGDATA 是 /var/lib/postgresql/18/docker，卷挂在上一级
      - pgdata:/var/lib/postgresql
      # 首启自动建库 + 还原 db/*.dump + 账号收敛为 admin@qq.com
      - ./db:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    networks:
      - default

  redis:
    image: redis:7-alpine
    container_name: ${STACK_PREFIX:-aistoryboard}-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - default

  minio:
    image: quay.io/minio/minio
    container_name: ${STACK_PREFIX:-aistoryboard}-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_ROOT_USER_FILE: ""
      MINIO_ROOT_PASSWORD_FILE: ""
      MINIO_ACCESS_KEY_FILE: ""
      MINIO_SECRET_KEY_FILE: ""
      MINIO_CONFIG_ENV_FILE: ""
      MINIO_KMS_SECRET_KEY_FILE: ""
      GOGC: "50"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # 迁移过来的对象数据：storyboard 桶（images/videos/documents/...）
      - ./data/minio:/data
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    mem_limit: ${MINIO_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      - default

  # ── Agent 沙箱（常驻；只接内网，出网走 Squid 白名单）──────────────────
  sandbox-egress-proxy:
    build:
      context: ../docker/sandbox/proxy
      dockerfile: Dockerfile
    image: moon-sandbox-egress-proxy:${SANDBOX_IMAGE_TAG:-local}
    container_name: ${STACK_PREFIX:-aistoryboard}-sandbox-egress-proxy
    restart: unless-stopped
    environment:
      SANDBOX_ALLOWED_DOMAINS: ${SANDBOX_ALLOWED_DOMAINS:?SANDBOX_ALLOWED_DOMAINS is required}
    networks:
      - default
      - sandbox-internal
      - sandbox-egress
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 128
    mem_limit: ${SANDBOX_PROXY_MEM_LIMIT:-256m}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3128"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    stop_grace_period: 10s

  sandbox-runner:
    build:
      context: ../..
      dockerfile: deploy/docker/sandbox/Dockerfile
      args:
        MOON_SANDBOX_UID: 10001
        MOON_SANDBOX_GID: 10001
    image: moon-sandbox-runner:${SANDBOX_IMAGE_TAG:-local}
    container_name: ${STACK_PREFIX:-aistoryboard}-sandbox-runner
    user: "10001:10001"
    restart: unless-stopped
    environment:
      MOON_SANDBOX_WORKSPACE_ROOT: /workspaces
      MOON_SANDBOX_PYTHON: python3
      MOON_SANDBOX_DEFAULT_TIMEOUT_SECONDS: "300"
      MOON_SANDBOX_MAX_TIMEOUT_SECONDS: "600"
      MOON_SANDBOX_MAX_CONCURRENT_EXECUTIONS: "4"
      MOON_SANDBOX_IDLE_EXPIRY: 24h
      MOON_SANDBOX_INTERNAL_SECRET: ${SANDBOX_INTERNAL_SECRET:?SANDBOX_INTERNAL_SECRET is required}
      HTTP_PROXY: http://sandbox-egress-proxy:3128
      HTTPS_PROXY: http://sandbox-egress-proxy:3128
      NO_PROXY: localhost,127.0.0.1,::1,sandbox-runner,sandbox-egress-proxy
      HOME: /tmp
      TMPDIR: /tmp
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=/tmp -Dfile.encoding=UTF-8 -Duser.timezone=${TZ:-Asia/Shanghai}
    volumes:
      # 运行时用 Docker 命名卷（不是宿主 bind mount）：ppt-master 会一次物化 12k 个小文件，
      # Windows Docker Desktop 的 bind mount 拷贝这种小文件极慢（实测 10 分钟级），
      # 会让模型请求还没发出、前端一直停在「思考中」。首次起栈时由脚本从
      # ./data/sandbox-workspaces 播种进卷，之后运行时写入都在卷里。
      - sandbox-workspaces:/workspaces
    ports:
      - "127.0.0.1:${SANDBOX_PORT:-8090}:8090"
    networks:
      - default
      - sandbox-internal
      - sandbox-edge
    read_only: true
    tmpfs:
      - /tmp:size=${SANDBOX_TMP_SIZE:-512m},mode=1777
    pids_limit: 256
    mem_limit: ${SANDBOX_MEM_LIMIT:-2g}
    cpus: ${SANDBOX_CPUS:-2.0}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8090/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    depends_on:
      sandbox-egress-proxy:
        condition: service_healthy

  # ── 6 个 Java 服务 ─────────────────────────────────────────────────────
  llm-gateway:
    <<: *java-base
    image: aistoryboard/llm-gateway:${IMAGE_TAG}
    container_name: ${STACK_PREFIX:-aistoryboard}-llm-gateway
    build:
      context: ./build/llm-gateway
      dockerfile: ../../service/Dockerfile
      args:
        BASE_IMAGE: aistoryboard/java-base:${IMAGE_TAG}
        APP_PORT: "8083"
    environment:
      <<: *java-base-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/llm_gateway
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      GATEWAY_JWT_ACCESS_SECRET: ${GATEWAY_JWT_ACCESS_SECRET}
      GATEWAY_JWT_REFRESH_SECRET: ${GATEWAY_JWT_REFRESH_SECRET}
      GATEWAY_AES_SECRET: ${GATEWAY_AES_SECRET}
      GATEWAY_ADMIN_INIT_PASSWORD: ${GATEWAY_ADMIN_INIT_PASSWORD}
    ports:
      # 模型网关（OpenAI 兼容 /v1/** + 管理后台 /admin-ui、/admin/**）只绑本机回环，
      # 需要远程管理时用 SSH 隧道，不要把 8083 直接暴露到公网。
      - "127.0.0.1:${GATEWAY_PORT:-8083}:8083"
    mem_limit: ${LLM_GATEWAY_MEM_LIMIT:-512m}
    networks:
      - default
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    <<: *java-base
    image: aistoryboard/backend:${IMAGE_TAG}
    container_name: ${STACK_PREFIX:-aistoryboard}-backend
    build:
      context: ./build/backend
      dockerfile: ../../service/Dockerfile
      args:
        BASE_IMAGE: aistoryboard/java-base:${IMAGE_TAG}
        APP_PORT: "8082"
    environment:
      <<: [*java-base-env, *db-env]
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      SPRING_AI_OPENAI_BASE_URL: http://llm-gateway:8083/v1
      SPRING_AI_OPENAI_API_KEY: ${LLM_GATEWAY_API_KEY_MAIN}
      AI_GATEWAY_BASE_URL: http://llm-gateway:8083
      AI_GATEWAY_API_KEY: ${LLM_GATEWAY_API_KEY_MAIN}
      LLM_GATEWAY_API_KEY: ${LLM_GATEWAY_API_KEY_MAIN}
      UPLOAD_ROOT: /data/uploads
    volumes:
      - uploads:/data/uploads
    mem_limit: ${BACKEND_MEM_LIMIT:-768m}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      llm-gateway:
        condition: service_started
    networks:
      - default

  asset-service:
    <<: *java-base
    image: aistoryboard/asset-service:${IMAGE_TAG}
    container_name: ${STACK_PREFIX:-aistoryboard}-asset-service
    build:
      context: ./build/asset-service
      dockerfile: ../../service/Dockerfile
      args:
        BASE_IMAGE: aistoryboard/java-base:${IMAGE_TAG}
        APP_PORT: "8085"
    environment:
      <<: [*java-base-env, *db-env]
      LLM_GATEWAY_API_KEY: ${LLM_GATEWAY_API_KEY_AGENT}
      AI_GATEWAY_BASE_URL: http://llm-gateway:8083
      AI_GATEWAY_API_KEY: ${LLM_GATEWAY_API_KEY_AGENT}
      ASSET_SIGNING_SECRET: ${INTERNAL_SECRET}
      STORYBOARD_ORPHAN_SCAN_ENABLED: "false"
      STORYBOARD_TRASH_RETENTION_DAYS: "3"
    mem_limit: ${ASSET_SERVICE_MEM_LIMIT:-512m}
    networks:
      - default
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  canvas:
    <<: *java-base
    image: aistoryboard/canvas:${IMAGE_TAG}
    container_name: ${STACK_PREFIX:-aistoryboard}-canvas
    build:
      context: ./build/canvas
      dockerfile: ../../service/Dockerfile
      args:
        BASE_IMAGE: aistoryboard/java-base:${IMAGE_TAG}
        APP_PORT: "9090"
    environment:
      <<: [*java-base-env, *db-env]
      SPRING_AI_OPENAI_BASE_URL: http://llm-gateway:8083/v1
      SPRING_AI_OPENAI_API_KEY: ${LLM_GATEWAY_API_KEY_AGENT}
      AI_GATEWAY_BASE_URL: http://llm-gateway:8083
      AI_GATEWAY_API_KEY: ${LLM_GATEWAY_API_KEY_AGENT}
      LLM_GATEWAY_API_KEY: ${LLM_GATEWAY_API_KEY_AGENT}
      UPLOAD_ROOT: /data/uploads
    volumes:
      - uploads:/data/uploads
    mem_limit: ${CANVAS_MEM_LIMIT:-768m}
    networks:
      - default
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  moon-agent:
    <<: *java-base
    image: aistoryboard/moon-agent:${IMAGE_TAG}
    container_name: ${STACK_PREFIX:-aistoryboard}-moon-agent
    build:
      context: ./build/moon-agent
      dockerfile: ../../service/Dockerfile
      args:
        BASE_IMAGE: aistoryboard/java-base-ffmpeg:${IMAGE_TAG}
        APP_PORT: "8084"
    environment:
      <<: [*java-base-env, *db-env]
      SPRING_AI_OPENAI_BASE_URL: http://llm-gateway:8083/v1
      SPRING_AI_OPENAI_API_KEY: ${LLM_GATEWAY_API_KEY_AGENT}
      AI_GATEWAY_BASE_URL: http://llm-gateway:8083
      AI_GATEWAY_API_KEY: ${LLM_GATEWAY_API_KEY_AGENT}
      LLM_GATEWAY_API_KEY: ${LLM_GATEWAY_API_KEY_AGENT}
      # 网页搜索：唯一后端是 DeepSeek 原生搜索；留空 = 不注册联网检索工具。
      AGENTSCOPE_WEB_SEARCH_API_KEY: ${AGENTSCOPE_WEB_SEARCH_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AGENTSCOPE_WEB_SEARCH_BASE_URL: ${AGENTSCOPE_WEB_SEARCH_BASE_URL:-https://api.deepseek.com/anthropic/v1}
      AGENTSCOPE_NACOS_ENABLED: "false"
      # 沙箱：默认开启（数据目录已随包迁移）
      AGENT_SANDBOX_ENABLED: ${AGENT_SANDBOX_ENABLED:-true}
      MOON_SANDBOX_BASE_URL: http://sandbox-runner:8090
      MOON_SANDBOX_INTERNAL_SECRET: ${SANDBOX_INTERNAL_SECRET:?SANDBOX_INTERNAL_SECRET is required}
      # 画布 MCP：canvas 服务同时提供图命令（canvas_graph_*）与浏览器执行命令（canvas_execute_*）
      MORROW_CANVAS_SERVER_URL: ${MORROW_CANVAS_SERVER_URL:-http://canvas:9090}
      VIDEO_MERGE_FFMPEG_PATH: /usr/bin/ffmpeg
      VIDEO_MERGE_FFPROBE_PATH: /usr/bin/ffprobe
      UPLOAD_ROOT: /data/uploads
    volumes:
      - uploads:/data/uploads
    mem_limit: ${MOON_AGENT_MEM_LIMIT:-1536m}
    extra_hosts:
      # 让容器能访问宿主上的服务（Docker Desktop 自带，Linux 需要这条）
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - sandbox-edge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      llm-gateway:
        condition: service_started
      backend:
        condition: service_started
      sandbox-runner:
        condition: service_healthy

  api-gateway:
    <<: *java-base
    image: aistoryboard/api-gateway:${IMAGE_TAG}
    container_name: ${STACK_PREFIX:-aistoryboard}-api-gateway
    build:
      context: ./build/api-gateway
      dockerfile: ../../service/Dockerfile
      args:
        BASE_IMAGE: aistoryboard/java-base:${IMAGE_TAG}
        APP_PORT: "8080"
    environment:
      <<: *java-base-env
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
    mem_limit: ${API_GATEWAY_MEM_LIMIT:-512m}
    networks:
      - default
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
      moon-agent:
        condition: service_started
      asset-service:
        condition: service_started
      canvas:
        condition: service_started

  # ── 公网入口：主站 + 画布站 + /api 反代 ────────────────────────────────
  frontend:
    image: aistoryboard/frontend:${IMAGE_TAG}
    container_name: ${STACK_PREFIX:-aistoryboard}-frontend
    restart: unless-stopped
    build:
      context: ./build/frontend
      dockerfile: ../../frontend/Dockerfile
    ports:
      - "${FRONTEND_BIND_IP:-0.0.0.0}:${FRONTEND_PORT:-80}:80"
    mem_limit: ${FRONTEND_MEM_LIMIT:-128m}
    networks:
      - default
    depends_on:
      api-gateway:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
    name: ${STACK_PREFIX:-aistoryboard}-pgdata
  uploads:
    name: ${STACK_PREFIX:-aistoryboard}-uploads
  redis-data:
    name: ${STACK_PREFIX:-aistoryboard}-redis-data
  sandbox-workspaces:
    name: ${STACK_PREFIX:-aistoryboard}-sandbox-workspaces

networks:
  default:
    name: ${STACK_PREFIX:-aistoryboard}
  sandbox-internal:
    name: ${STACK_PREFIX:-aistoryboard}-sandbox-internal
    internal: true
  sandbox-egress:
    name: ${STACK_PREFIX:-aistoryboard}-sandbox-egress
  sandbox-edge:
    name: ${STACK_PREFIX:-aistoryboard}-sandbox-edge
