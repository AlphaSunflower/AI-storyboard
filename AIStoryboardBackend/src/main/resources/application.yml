# =============================================================================
# SECRETS POLICY
# Secrets (DB password, JWT keys, API keys) MUST be set via environment
# variables or application-local.yml.  No defaults are committed.
# The app will fail fast at startup if any secret is missing.
# =============================================================================

spring:
  application:
    name: ai-storyboard
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:newworkflow}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  profiles:
    active: local

server:
  port: ${SERVER_PORT:8082}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_uuid
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  access-secret: ${JWT_ACCESS_SECRET}
  refresh-secret: ${JWT_REFRESH_SECRET}
  issuer: ${JWT_ISSUER:newworkflow-backend}
  access-token-ttl: 3600
  refresh-token-ttl: 2592000

# ═══════════════════════════════════════════════════════
# AI / Laozhang configuration
# Model names and API paths live here — change once, not in code.
# ═══════════════════════════════════════════════════════
ai:
  laozhang:
    # ── Secrets (override in env or application-local.yml) ──
    api-key: ${LAOZ...KEY}
    sora2-official-api-key: ${LAOZ...KEY}
    # Dify Agent API 密钥
    dify-api-key: ${AI_DIFY_API_KEY:}
    # Dify 自托管基础地址（默认本机 Docker 部署）
    dify-base-url: ${DIFY_BASE_URL:http://localhost}

    # ── MiniMax 视频通道（V2 接口，默认 provider；密钥来自 .env MINIMAX_API_KEY，不提交）──
    minimax-api-key: ${MINIMAX_API_KEY:}
    minimax-base-url: ${MINIMAX_BASE_URL:https://api.minimaxi.com}
    # 视频生成通道：minimax（默认）| laozhang（保留可切回）
    video-provider: ${VIDEO_PROVIDER:minimax}
    # MiniMax 模型与分辨率档位（768P 最低档 | 2K）
    minimax-video-model: ${MINIMAX_VIDEO_MODEL:MiniMax-H3}
    minimax-video-resolution: ${MINIMAX_VIDEO_RESOLUTION:768P}

    # ── Base URLs ──
    base-url-openai: https://api2.laozhang.ai/v1
    base-url-gemini: https://api2.laozhang.ai/v1beta/models/gemini-3-pro-image-preview:generateContent
    base-url-vision: https://api2.laozhang.ai/v1/chat/completions

    # ── API endpoint paths (relative to base-url-openai) ──
    endpoint-image-generations: /images/generations
    endpoint-video-create: /videos
    endpoint-video-status: /videos/
    endpoint-video-status-fallback: /video/generations/
    endpoint-video-content: /videos/

    # ── Model routing ──
    gemini-image-models: gemini-3-pro-image-preview
    sora2-models: gpt-image-2-official
    video-model-aliases: '{"veo-3.1-fast":"veo-3.1-fast-generate-preview","veo-3.1-fast-fl":"veo-3.1-fast-generate-preview","veo-3.1":"veo-3.1-generate-preview","veo-3.1-fl":"veo-3.1-generate-preview"}'

    # ── Defaults ──
    default-image-model: gpt-image-2
    default-vision-model: gemini-3-flash-preview
    default-image-size: "1024x1024"
    default-video-duration: "8"

    # ── File storage ──
    video-upload-dir: uploads/videos
    video-file-extension: .mp4
    video-url-prefix: /api/files/videos/

    # ── Polling ──
    poll-interval-ms: 5000
    poll-timeout-ms: 600000
