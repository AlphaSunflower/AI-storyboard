        prompt_template:
        - id: c1d23bf5-35ed-4fc0-b5c9-54916957189f
          role: system
          text: "结合用户当前输入 + 全部历史对话记录，识别用户意图归属四类：\n  ai_split = AI 分镜制作（故事板/分镜脚本）\n  pic = 图片生成（单张插图/海报/角色设计）\n  video = 视频生成（短视频/动画片段）\n  other = 打招呼、闲聊、询问功能等\n\n规则：\n- 若无法明确区分，message 引导用户：你希望 AI 分镜还是视频生成或者图片生成呢？\n- 最终只输出纯 JSON 结构，无额外解释\n\n输出格式：\n{\"type\":\"ai_split|pic|video|other\",\"message\":\"回复内容\"}"
        selected: false
        structured_output:
          schema:
            additionalProperties: false
            properties:
              message:
                description: 回复用户的内容
                type: string
              type:
                description: 意图类型
                enum:
                - ai_split
                - pic
                - video
                - other
                type: string
            required:
            - message
            - type
            type: object
        structured_output_enabled: true
        title: 意图识别
        type: llm
        vision:
