# =============================================================================
# SECRETS POLICY
# Secrets (DB password, JWT keys, API keys) MUST be set via environment
# variables or application-local.yml.  No defaults are committed.
# The app will fail fast at startup if any secret is missing.
# =============================================================================

spring:
  application:
    name: ai-storyboard
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:newworkflow}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  profiles:
    active: local
  ai:
    openai:
      base-url: ${LLM_GATEWAY_BASE_URL:http://localhost:8083}/v1
      api-key: ${LLM_GATEWAY_API_KEY:}

server:
  port: ${SERVER_PORT:8082}

# 只暴露 health 端点（部署探活），其余 actuator 端点不外泄
management:
  endpoints:
    web:
      exposure:
        include: health

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_uuid
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  access-secret: ${JWT_ACCESS_SECRET}
  refresh-secret: ${JWT_REFRESH_SECRET}
  issuer: ${JWT_ISSUER:newworkflow-backend}
  access-token-ttl: 3600
  refresh-token-ttl: 2592000

# ═══════════════════════════════════════════════════════
# AI configuration — 模型名/默认值（LLM 调用统一走网关，见 ai.gateway / spring.ai.openai）
# ═══════════════════════════════════════════════════════
ai:
  # Agent 编排行为参数（意图阈值 / 澄清上限）
  agent:
    # 意图识别低置信度阈值：低于则触发澄清分支（不硬路由）
    intent-threshold: ${AGENT_INTENT_THRESHOLD:0.6}
    # 澄清追问上限：连续追问达到该值后直接给默认方案让用户选
    max-clarify-rounds: ${AGENT_MAX_CLARIFY_ROUNDS:2}
    # 分镜不满意调整上限：连续「不满意→调整→重生成」达到该值后不再弹调整卡片
    max-regenerate-rounds: ${AGENT_MAX_REGENERATE_ROUNDS:3}
  laozhang:

    # MiniMax 模型与分辨率档位（768P 最低档 | 2K）
    minimax-video-model: ${MINIMAX_VIDEO_MODEL:MiniMax-H3}

    # ── Model routing ──
    gemini-image-models: gemini-3-pro-image-preview
    video-model-aliases: '{"veo-3.1-fast":"veo-3.1-fast-generate-preview","veo-3.1-fast-fl":"veo-3.1-fast-generate-preview","veo-3.1":"veo-3.1-generate-preview","veo-3.1-fl":"veo-3.1-generate-preview"}'

    # ── Defaults ──
    default-image-model: gpt-image-2
    default-image-edit-model: ${DEFAULT_IMAGE_EDIT_MODEL:gpt-image-2}  # 图生图/图改图默认模型（独立于文生图）
    default-vision-model: gemini-3-flash-preview
    default-image-size: "1024x1024"
    default-video-duration: "8"

    # ── File storage ──
    video-upload-dir: uploads/videos
    video-file-extension: .mp4
    video-url-prefix: /api/files/videos/

  # ── LLM 网关（chat/文生图统一入口；edits 图改图保持直连）──
  gateway:
    base-url: ${LLM_GATEWAY_BASE_URL:http://localhost:8083}
    api-key: ${LLM_GATEWAY_API_KEY:}
