server:
  port: 8084

spring:
  application:
    name: moon-agent
  profiles:
    active: local
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        enabled: true
  datasource:
    driver-class-name: org.postgresql.Driver
    # 注意：不用 ${DB_URL:...} 占位符——本机存在其他项目遗留的 DB_URL/DB_USERNAME/DB_PASSWORD 全局环境变量（MySQL），会被污染
    # 生产部署用 SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD 覆盖（环境变量优先级高于 yaml）
    # 本地开发凭据在 application-local.yml
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  ai:
    openai:
      base-url: ${LLM_GATEWAY_BASE_URL:http://localhost:8083}/v1
      api-key: ${LLM_GATEWAY_API_KEY:lg-df377c8084e645ffa34e0dfce1fb3e78}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_uuid
      logic-delete-field: deleted

# 只暴露 health 端点（部署探活），其余 actuator 端点不外泄
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

# 主后端内部 API 地址（服务间调用）
storyboard:
  internal-url: ${STORYBOARD_INTERNAL_URL:http://localhost:8082}
  internal-secret: ${INTERNAL_SECRET:moon-internal-secret-2024}

# 上传根目录：monorepo 本地指向主后端 uploads（文件共享，前端统一经主后端 /api/files/** 读取）；生产配共享存储
ai:
  upload-root: ${UPLOAD_ROOT:../AIStoryboardBackend/uploads}
