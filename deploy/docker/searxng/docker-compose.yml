# deploy/docker/searxng/docker-compose.yml
# SearXNG 自托管搜索：Moon 的 web_search 默认后端（provider=searxng）。
# 与 nacos/vosk/minio 一样是独立 Compose 项目，可单独启停、可整目录拷到其他机器。
#
# 用法：
#   cd deploy/docker/searxng
#   cp .env.example .env
#   docker compose --env-file .env up -d
#   curl.exe -s "http://localhost:8888/search?q=test&format=json" | Select-Object -First 1
#
# 注意：SearXNG 默认**不返回 json**（search.formats 只有 html），
# 而 Moon 走的就是 json。本目录的 settings.yml 已在模板里开好这一项；
# 若你换成官方 searxng-docker 的 settings.yml，必须自己补：
#   search:
#     formats:
#       - html
#       - json
services:
  searxng:
    # 固定大版本，避免上游不兼容变更在无人值守时被拉进来
    image: docker.io/searxng/searxng:2026.10.13-22c64b8d3
    container_name: searxng
    environment:
      # 官方镜像入口脚本会把这个值 envsubst 进 settings.yml 的 server.secret_key
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET is required（生成：openssl rand -hex 32）}
      # 容器内没有写权限的卷或需要额外设置时的兜底，保持官方默认即可
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://localhost:8888/}
      # 出网少的中文场景可按需打开（默认注释，避免无谓的额外请求）
      # SEARXNG_AUTOCOMPLETE: ""
    ports:
      # 只绑本机：Moon 与 SearXNG 同机运行时无需对外暴露
      - "${SEARXNG_BIND_IP:-127.0.0.1}:${SEARXNG_PORT:-8888}:8080"
    volumes:
      # 用本目录的 settings.yml（已开 json 输出 + 关 limiter，便于服务间调用）
      - ./settings.yml:/etc/searxng/settings.yml:ro
      # uwsgi 缓存等运行期文件；不要删这个卷，否则每次重建都要重新初始化
      - searxng-cache:/var/cache/searxng
    # SearXNG 对上游引擎有较强的反爬/UA 要求，给足启动与请求处理时间
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  searxng-cache:
