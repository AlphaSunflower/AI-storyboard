spring:
  application:
    name: llm-gateway
  profiles:
    active: local            # 默认本地环境；生产用 --spring.profiles.active=prod 覆盖
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  datasource:
    driver-class-name: org.postgresql.Driver

server:
  port: 8083

# 只暴露 health 端点（部署探活），其余 actuator 端点不外泄
management:
  endpoints:
    web:
      exposure:
        include: health

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_uuid
      logic-delete-field: deleted
      logic-delete-value: true      # BOOLEAN 列，不能用 1/0（实测踩坑）
      logic-not-delete-value: false

gateway:
  jwt:
    issuer: llm-gateway
    access-token-ttl: 3600
    refresh-token-ttl: 2592000