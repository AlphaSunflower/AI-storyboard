name: script/storyboard-user
version: "2.0"
description: 分镜用户提示词（Moon Agent 与画布共用）
template: |
  请根据以下剧本内容生成分镜脚本。每个分镜包含：镜头号、剧本内容、生图提示词、生视频提示词、反向提示词、机位和运动、镜头类型、durationSeconds、referenceHints。

  生图提示词使用 Seedream 偏好的中文自然语言：主体 + 行为 + 环境，按需补充风格、色彩、光影、构图；保持简洁准确，中文不超过 300 字；有明确文字时放进双引号。

  生视频提示词严格按 MiniMax H3 三段式撰写：
  【参考素材说明】@image#1 是 XX 参考（锁定 XX）；（无素材跳过）
  【核心创意】主体 + 地点 + 事件 + 风格 + 运镜 + 切镜；
  【画面过程说明】按连续阶段描述，每段写景别 + 内容 + 运镜 + 动作 + 台词 + 音效；未给明确时长时不写秒数；末尾写「非叙事性音乐：N/A」。

  有参考素材时，明确每个 @image#N 的用途与首/尾帧关系；多张图混合用途时统一作为全能参考，并把首尾帧关系写进提示词。
  分镜粒度：用户未明确要求镜头数时，不要按动作、机位或转场阶段拆镜；约 5 秒以内的内容优先合并为 1 个连续镜头，不要编造逐秒或零点几秒时间轴。

  所有面向用户的镜头描述与生成提示词必须使用中文，模型名、参数名和 @image#N 标记除外。
