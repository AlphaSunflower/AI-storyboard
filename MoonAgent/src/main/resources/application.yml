server:
  port: 8084

spring:
  application:
    name: moon-agent
  profiles:
    active: local
  cloud:
    compatibility-verifier:
      enabled: false   # Boot 4.1.1 与 Spring Cloud 2025.1 官方未配对；Framework 同为 7.0.x 实机可跑，SC 出 4.1 配对车后可删
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        # 服务发现总开关：默认关闭（不注册、不走发现），网关按直连地址路由。
        # 需要恢复注册发现时设 NACOS_DISCOVERY_ENABLED=true，并先起 deploy/docker/nacos。
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 10000
      validation-timeout: 3000
      data-source-properties:
        reWriteBatchedInserts: true
  task:
    scheduling:
      pool:
        size: ${SPRING_TASK_SCHEDULING_POOL_SIZE:4}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
    # 注意：不用 ${DB_URL:...} 占位符——本机存在其他项目遗留的 DB_URL/DB_USERNAME/DB_PASSWORD 全局环境变量（MySQL），会被污染
    # 生产部署用 SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD 覆盖（环境变量优先级高于 yaml）
    # 本地开发凭据在 application-local.yml
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  ai:
    openai:
      base-url: ${LLM_GATEWAY_BASE_URL:${ai.gateway.base-url:http://localhost:8083}}/v1
      api-key: ${LLM_GATEWAY_API_KEY:${ai.gateway.api-key:}}
      # Spring AI 2.0 默认 60s；画布技能会在单次请求内执行长工具循环
      timeout: 3600s
      # 超时/连接失败不做 SDK 级隐式重试，避免单次 120s 超时被放大为多次串行请求
      max-retries: 0

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_uuid
      logic-delete-field: deleted

# 只暴露 health 端点（部署探活），其余 actuator 端点不外泄
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

# 主后端内部 API 地址（服务间调用）
storyboard:
  internal-url: ${STORYBOARD_INTERNAL_URL:http://localhost:8082}
  internal-secret: ${INTERNAL_SECRET:}
  video:
    queue-concurrency: ${STORYBOARD_VIDEO_QUEUE_CONCURRENCY:2}
  asset-client:
    base-url: ${ASSET_SERVICE_URL:http://localhost:8085}
    internal-token: ${INTERNAL_SECRET:${storyboard.internal-secret:}}
    connect-timeout-seconds: 10
    read-timeout-seconds: 30
  # MinIO 对象存储（图片/视频/音频统一存对象存储，替代本地 uploads/）
  # 默认指向本机 MinIO（本地开发）；生产在 application-prod.yml 覆盖。
  storage:
    endpoint: ${STORYBOARD_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORYBOARD_STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORYBOARD_STORAGE_SECRET_KEY:}
    bucket: storyboard
    region: us-east-1

# 上传根目录：monorepo 本地指向主后端 uploads（文件共享，前端统一经主后端 /api/files/** 读取）；生产配共享存储
ai:
  upload-root: ${UPLOAD_ROOT:../AIStoryboardBackend/uploads}
  storyboard:
    production-v2:
      enabled: ${STORYBOARD_PRODUCTION_V2_ENABLED:true}
      model-mode: ${STORYBOARD_PRODUCTION_V2_MODEL_MODE:live}
      fast-timeout-seconds: ${STORYBOARD_PRODUCTION_V2_FAST_TIMEOUT:120}
      repair-timeout-seconds: ${STORYBOARD_PRODUCTION_V2_REPAIR_TIMEOUT:90}
  video:
    merge:
      ffmpeg-path: ${VIDEO_MERGE_FFMPEG_PATH:ffmpeg}
      ffprobe-path: ${VIDEO_MERGE_FFPROBE_PATH:ffprobe}
      timeout-seconds: ${VIDEO_MERGE_TIMEOUT_SECONDS:600}
  storyboard-internal-url: ${STORYBOARD_INTERNAL_URL:http://localhost:8082}   # 主后端地址：参考素材(/api/files/**) 本地缺失时经此拉取
  gateway:
    base-url: ${LLM_GATEWAY_BASE_URL:http://localhost:8083}
    api-key: ${LLM_GATEWAY_API_KEY:}

  agent:
    workflow:
      custom-enabled: ${AGENT_CUSTOM_WORKFLOW_ENABLED:false}
    documents:
      enabled: ${AGENT_DOCUMENTS_ENABLED:true}
      parse-timeout-seconds: ${AGENT_DOCUMENTS_PARSE_TIMEOUT:45}
      summary-timeout-seconds: ${AGENT_DOCUMENTS_SUMMARY_TIMEOUT:60}
      max-parse-chars: ${AGENT_DOCUMENTS_MAX_PARSE_CHARS:1000000}
      default-read-chars: ${AGENT_DOCUMENTS_DEFAULT_READ_CHARS:8000}
      max-read-chars: ${AGENT_DOCUMENTS_MAX_READ_CHARS:12000}
      summary-chunk-chars: ${AGENT_DOCUMENTS_SUMMARY_CHUNK_CHARS:12000}
      summary-max-chunks: ${AGENT_DOCUMENTS_SUMMARY_MAX_CHUNKS:24}
      summary-concurrency: ${AGENT_DOCUMENTS_SUMMARY_CONCURRENCY:3}
      summary-max-chars: ${AGENT_DOCUMENTS_SUMMARY_MAX_CHARS:1500}
      cache-max-bytes: ${AGENT_DOCUMENTS_CACHE_MAX_BYTES:67108864}
      cache-expire-minutes: ${AGENT_DOCUMENTS_CACHE_EXPIRE_MINUTES:30}
      recent-summary-limit: ${AGENT_DOCUMENTS_RECENT_SUMMARY_LIMIT:5}
      recent-summary-max-chars: ${AGENT_DOCUMENTS_RECENT_SUMMARY_MAX_CHARS:6000}
      summary-model: ${AGENT_DOCUMENTS_SUMMARY_MODEL:${AGENTSCOPE_FALLBACK_MODEL:deepseek-flash}}
    tool-audit:
      enabled: ${AGENT_TOOL_AUDIT_ENABLED:true}
      ui-enabled: ${AGENT_TOOL_AUDIT_UI_ENABLED:true}
      retention-days: ${AGENT_TOOL_AUDIT_RETENTION_DAYS:90}
      cleanup-batch-size: ${AGENT_TOOL_AUDIT_CLEANUP_BATCH_SIZE:500}
    sandbox:
      enabled: ${AGENT_SANDBOX_ENABLED:false}
      base-url: ${MOON_SANDBOX_BASE_URL:http://127.0.0.1:8090}
      internal-secret: ${MOON_SANDBOX_INTERNAL_SECRET:}
      connect-timeout: ${MOON_SANDBOX_CONNECT_TIMEOUT:5s}
      read-timeout: ${MOON_SANDBOX_READ_TIMEOUT:10m}
    recovery:
      # legacy: 旧 @Scheduled 恢复入口；coordinator: 统一租约协调器。
      mode: ${AGENT_RECOVERY_MODE:coordinator}
      scan-delay: ${AGENT_RECOVERY_SCAN_DELAY:5s}
      max-parallel: ${AGENT_RECOVERY_MAX_PARALLEL:4}
      lease-duration: ${AGENT_RECOVERY_LEASE_DURATION:120s}
      max-attempts: ${AGENT_RECOVERY_MAX_ATTEMPTS:5}
      base-backoff: ${AGENT_RECOVERY_BASE_BACKOFF:5s}
      max-backoff: ${AGENT_RECOVERY_MAX_BACKOFF:5m}
    agentscope:
      enabled: ${AGENTSCOPE_ENABLED:true}
      model: ${AGENTSCOPE_MODEL:}
      fallback-model: ${AGENTSCOPE_FALLBACK_MODEL:deepseek-flash}
      max-retries: ${AGENTSCOPE_MAX_RETRIES:3}
      max-iters: ${AGENTSCOPE_MAX_ITERS:24}
      asset-search-limit: ${AGENTSCOPE_ASSET_SEARCH_LIMIT:8}
      direct-media-generation: ${AGENTSCOPE_DIRECT_MEDIA_GENERATION:true}
      # 复合旅程（produce_video_journey）分支阈值：≤ 该秒数走「生图 → 视频」，
      # 超过则走「分镜 → 逐镜图片 → 逐镜视频 → 合成」。
      journey-direct-video-max-seconds: ${AGENTSCOPE_JOURNEY_DIRECT_VIDEO_MAX_SECONDS:15}
      state-schema: ${AGENTSCOPE_STATE_SCHEMA:public}
      state-table: ${AGENTSCOPE_STATE_TABLE:agentscope_sessions}
      workspace-dir: ${AGENTSCOPE_WORKSPACE_DIR:${java.io.tmpdir}/moonagent-agentscope}
      structured-output-enabled: ${AGENTSCOPE_STRUCTURED_OUTPUT_ENABLED:true}
      subagents-enabled: ${AGENTSCOPE_SUBAGENTS_ENABLED:true}
      plan-mode-enabled: ${AGENTSCOPE_PLAN_MODE_ENABLED:true}
      task-list-enabled: ${AGENTSCOPE_TASK_LIST_ENABLED:true}
      plan-file-directory: ${AGENTSCOPE_PLAN_FILE_DIRECTORY:plans}
      tool-result-eviction-enabled: ${AGENTSCOPE_TOOL_RESULT_EVICTION_ENABLED:true}
      tool-result-eviction-max-chars: ${AGENTSCOPE_TOOL_RESULT_EVICTION_MAX_CHARS:16000}
      tool-result-eviction-preview-chars: ${AGENTSCOPE_TOOL_RESULT_EVICTION_PREVIEW_CHARS:2000}
      otel-tracing-enabled: ${AGENTSCOPE_OTEL_TRACING_ENABLED:true}
      distributed-store-enabled: ${AGENTSCOPE_DISTRIBUTED_STORE_ENABLED:true}
      web-search:
        # 两个后端，用 provider 切换（默认 searxng = 全自托管，无第三方 key/计费）：
        #   searxng  → POST {searxng-url}/search?format=json（自己部署的 SearXNG）
        #   deepseek → POST {base-url}/messages，带服务端工具 web_search_20250305（对齐 DSH 的
        #              dsh-web-search-deepseek；搜索在 DeepSeek 服务端执行，按账号计费，需 key）
        # 注意 deepseek 的 base-url 不是 ai.gateway.base-url：原生搜索只存在于 Anthropic
        # Messages 协议上，网关是 chat-completions 协议，透不过这种服务端工具。
        enabled: ${AGENTSCOPE_WEB_SEARCH_ENABLED:true}
        provider: ${AGENTSCOPE_WEB_SEARCH_PROVIDER:searxng}
        # ---- SearXNG 后端（默认）----
        # 实例的 settings.yml 必须开 json 输出：search: formats: [html, json]，否则返回 403。
        searxng-url: ${AGENTSCOPE_SEARXNG_URL:http://localhost:8888}
        searxng-language: ${AGENTSCOPE_SEARXNG_LANGUAGE:zh-CN}
        # ---- DeepSeek 原生搜索后端（provider=deepseek 时才需要 key）----
        base-url: ${AGENTSCOPE_WEB_SEARCH_BASE_URL:https://api.deepseek.com/anthropic/v1}
        api-key: ${AGENTSCOPE_WEB_SEARCH_API_KEY:${DEEPSEEK_API_KEY:}}
        model: ${AGENTSCOPE_WEB_SEARCH_MODEL:deepseek-v4-flash}
        max-results: ${AGENTSCOPE_WEB_SEARCH_MAX_RESULTS:8}
        # 原生搜索 = 一次完整模型轮次，默认超时比纯检索端点长。
        timeout: ${AGENTSCOPE_WEB_SEARCH_TIMEOUT:60s}
        max-uses: ${AGENTSCOPE_WEB_SEARCH_MAX_USES:5}
        max-tokens: ${AGENTSCOPE_WEB_SEARCH_MAX_TOKENS:4096}
        # 成功结果的 TTL + 条数上限：同 query 窗口内命中缓存，避免重复调用。
        cache-ttl: ${AGENTSCOPE_WEB_SEARCH_CACHE_TTL:5m}
        cache-max-entries: ${AGENTSCOPE_WEB_SEARCH_CACHE_MAX_ENTRIES:256}
      critique-enabled: ${AGENTSCOPE_CRITIQUE_ENABLED:true}
      critique-max-repairs: ${AGENTSCOPE_CRITIQUE_MAX_REPAIRS:1}
      models:
        plan: ${AGENTSCOPE_MODEL_PLAN:}
        prompt: ${AGENTSCOPE_MODEL_PROMPT:}
        critic: ${AGENTSCOPE_MODEL_CRITIC:}
        vision: ${AGENTSCOPE_MODEL_VISION:}
        image: ${AGENTSCOPE_MODEL_IMAGE:}
        video: ${AGENTSCOPE_MODEL_VIDEO:}
      compaction-enabled: ${AGENTSCOPE_COMPACTION_ENABLED:true}
      compaction-trigger-messages: ${AGENTSCOPE_COMPACTION_TRIGGER_MESSAGES:40}
      compaction-trigger-tokens: ${AGENTSCOPE_COMPACTION_TRIGGER_TOKENS:48000}
      compaction-keep-messages: ${AGENTSCOPE_COMPACTION_KEEP_MESSAGES:12}
      compaction-keep-tokens: ${AGENTSCOPE_COMPACTION_KEEP_TOKENS:8000}
      async-enabled: ${AGENTSCOPE_ASYNC_ENABLED:true}
      async-tool-timeout: ${AGENTSCOPE_ASYNC_TOOL_TIMEOUT:90s}
      batch-confirm-threshold: ${AGENTSCOPE_BATCH_CONFIRM_THRESHOLD:4}
      image-batch-concurrency: ${AGENTSCOPE_IMAGE_BATCH_CONCURRENCY:4}
      wakeup-enabled: ${AGENTSCOPE_WAKEUP_ENABLED:true}
      wakeup-dir: ${AGENTSCOPE_WAKEUP_DIR:}
      wakeup-max-retries: ${AGENTSCOPE_WAKEUP_MAX_RETRIES:5}
      wakeup-retry-delay: ${AGENTSCOPE_WAKEUP_RETRY_DELAY:2s}
      preflight:
        enabled: ${AGENTSCOPE_PREFLIGHT_ENABLED:true}
        timeout: ${AGENTSCOPE_PREFLIGHT_TIMEOUT:20s}
        reference-confidence-threshold: ${AGENTSCOPE_PREFLIGHT_REFERENCE_CONFIDENCE:0.65}
        max-repairs: ${AGENTSCOPE_PREFLIGHT_MAX_REPAIRS:1}
      # Nacos is the versioned source for production assets. Keep this disabled
      # until the release label and asset set have been published and verified.
      nacos:
        enabled: ${AGENTSCOPE_NACOS_ENABLED:false}
        server-address: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:public}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        skill-version: ${AGENTSCOPE_NACOS_SKILL_VERSION:}
        skill-label: ${AGENTSCOPE_NACOS_SKILL_LABEL:stable}
        prompt-key: ${AGENTSCOPE_NACOS_PROMPT_KEY:moon-agent-global-system}
        prompt-version: ${AGENTSCOPE_NACOS_PROMPT_VERSION:}
        prompt-label: ${AGENTSCOPE_NACOS_PROMPT_LABEL:stable}
        allow-classpath-fallback: ${AGENTSCOPE_NACOS_CLASSPATH_FALLBACK:true}
        connect-timeout: ${AGENTSCOPE_NACOS_CONNECT_TIMEOUT:2s}
        request-timeout: ${AGENTSCOPE_NACOS_REQUEST_TIMEOUT:5s}
        skill-names:
          - image
          - video
          - storyboard
          - canvas-design
          - canvas-run
          - general
    media-plan-slow-notice-seconds: ${MEDIA_PLAN_SLOW_NOTICE_SECONDS:60}
    media-plan-timeout-seconds: ${MEDIA_PLAN_TIMEOUT_SECONDS:120}
    plan-timeout-seconds: 1800
    recommend-timeout-seconds: 120
    # 素材编排优先等待高质量模型完成，超时边界与网关保持一致
    material-timeout-seconds: 1800
    # 骨架只做结构化规划，显式使用快模型；场景 worker 仍使用高质量模型
    skeleton-model: ${AGENT_SKELETON_MODEL:mimo-v2.6-pro}
    max-parallel-agents: ${AGENT_MAX_PARALLEL_AGENTS:4}
    global-concurrency: ${AGENT_GLOBAL_CONCURRENCY:4}
    per-user-concurrency: ${AGENT_PER_USER_CONCURRENCY:2}
    concurrency-acquire-timeout-seconds: ${AGENT_CONCURRENCY_ACQUIRE_TIMEOUT_SECONDS:30}
    intent-timeout-seconds: 60
    title-model: ${AGENT_TITLE_MODEL:mimo-v2.6-pro}
    title-timeout-seconds: ${AGENT_TITLE_TIMEOUT_SECONDS:12}
    title-max-attempts: ${AGENT_TITLE_MAX_ATTEMPTS:2}
    # 长剧本分批生成可能持续十余分钟；该值控制 MVC SSE 连接生命周期
    sse-timeout-seconds: 14400
    history-context-max-chars: 10000
    history-message-max-chars: 2000
  # ── 超时 / 重试（秒/毫秒，Java 默认值已对齐当前行为，仅需覆盖时取消注释）──
  image-request-timeout: 180
  image-edit-timeout: 180
  video-request-timeout: 120
  video-create-timeout: 120
  video-poll-timeout: 600
  video-download-timeout: 900
  video-retry-delay-ms: 15000
  script-timeout: 1800
  script-max-tokens: 8192
  gateway-model-timeout: 5
  gateway-cooldown-ms: 300000

# ── MCP Server（暴露 agent 工具给外部 MCP 客户端）──
spring.ai.mcp.server.enabled: true
spring.ai.mcp.server.name: moon-agent
spring.ai.mcp.server.version: 1.0.0
spring.ai.mcp.server.type: SYNC
spring.ai.mcp.server.protocol: STREAMABLE
# ── MCP Client（接入外部 MCP 服务器）──
spring.ai.mcp.client.enabled: true
spring.ai.mcp.client.type: SYNC
spring.ai.mcp.client.initialized: false
spring.ai.mcp.client.toolcallback.enabled: true
# 同步媒体 MCP 会等待生图完成；SDK 默认仅 20s，会导致服务端继续生成但客户端先超时。
spring.ai.mcp.client.request-timeout: ${MCP_CLIENT_REQUEST_TIMEOUT:1800s}
# Canvas MCP Server（XiaoYueCanvas：服务端图命令 + 浏览器执行命令都走这一条连接）
spring.ai.mcp.client.streamable-http.connections.canvas-server.url: ${MORROW_CANVAS_SERVER_URL:http://localhost:9090}
spring.ai.mcp.client.streamable-http.connections.canvas-server.endpoint: /api/canvas/mcp
# LLM Gateway media MCP（仅暴露 generate_image / generate_video）
spring.ai.mcp.client.streamable-http.connections.gateway.url: ${LLM_GATEWAY_BASE_URL:http://localhost:8083}
spring.ai.mcp.client.streamable-http.connections.gateway.endpoint: /mcp

# 提示词文件目录（文件系统路径，支持热刷新）
prompts:
  dir: src/main/resources/prompts
