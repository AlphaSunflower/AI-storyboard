            JSON。


            【分镜方案内容】

            {{#context#}}


            【分镜数量】

            - 按剧情拆分为 6~20 个分镜,按时间顺序排列,sceneNumber 从 1 开始连续递增;同一动作不要拆成多个分镜。


            【每个分镜 8 个字段,全部必填】

            1. sceneNumber(整数):分镜序号,从 1 开始。

            2. scriptContent(字符串):镜头剧情与台词,30~80 字,剧本口吻,写清人物动作与对白。

            3. imagePrompt(字符串):图片正向提示词,50~100 字,中文。必须含:画面主体与动作、环境背景、光线色调、构图(主体位置/视角/景深)、整体风格(与已确认方案一致)。可直接用于文生图,不要写画幅尺寸。

            4. videoPrompt(字符串):视频动态提示词,50~120 字,中文。必须含:画面主体与动作、环境、光线氛围、运镜(具体到起幅落幅)、景别视角。可直接用于视频生成,不要写分辨率/时长参数。

            5. negativePrompt(字符串):负面规避词,30~60 字,中文逗号分隔。默认:"文字,水印,logo,模糊,变形,多余肢体,低质量";按画面内容可增删(无文字需求则加"无文字无字幕")。

            6. cameraMovement(字符串):只能从 推/拉/摇/移/跟/升/降 中选择,可组合(如"缓慢推近""从左向右横摇"),禁止笼统写"镜头运动"。

            7. shotType(字符串):只能从 远景/全景/中景/近景/特写/大特写 中选择一个。

