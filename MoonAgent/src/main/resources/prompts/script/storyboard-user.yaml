name: script/storyboard-user
version: "2.0"
description: 分镜用户提示词
template: |
  请根据以下剧本内容生成分镜脚本。每个分镜包含：镜头号、剧本内容、生图提示词（格式：【镜头构图】→【场景主体】→【环境细节/道具】→【光线与色彩】→【氛围情绪】）、生视频提示词、反向提示词、机位和运动、镜头类型、声音设计、referenceBindings。
  只输出 JSON 数组；sceneNumber 用数字；不要代码块、不要 {"scenes":[...]} 包装、不要尾逗号。

  生视频提示词严格按 MiniMax H3 三段式撰写：
  【参考素材说明】@图片1 是XX参考（锁XX）…（无素材跳过）；【核心创意】主体+地点+事件+风格+运镜+切镜；【画面过程说明】按时间轴分段，每段写景别+内容+运镜+动作+台词+音效；末尾写「非叙事性音乐：N/A」。
  有参考素材时，明确每个 @图片N 的用途与首/尾帧关系；多张图混合用途时统一用「作为全能参考」，并把首尾帧关系写进提示词。
