    - data:
        code: "def main(step: int, action: str, llm_output: str = \"\", http_body: str = \"\") -> dict:\n    import json\n\n    transitions = {\n        \"intent_detected\": 1,\n        \"design_not_satisfied\": step,\n        \"design_approved\": {1: 2, 3: 5, 4: 6},\n        \"http_done\": {2: 3, 5: 4, 6: -1},\n        \"jump_to\": step,\n        \"reset\": -1,\n    }\n\n    next_step = transitions.get(action, step)\n    if isinstance(next_step, dict):\n        next_step = next_step.get(step, step + 1)\n\n    result = {\"next_step\": next_step}\n\n    if llm_output:\n        result[\"last_answer_text\"] = llm_output\n    if http_body:\n        try:\n            body = json.loads(http_body)\n        except:\n            body = {}\n        if \"imageUrl\" in body:\n            result[\"last_image_url\"] = body[\"imageUrl\"]\n        if \"videoUrl\" in body:\n            result[\"last_video_url\"] = body[\"videoUrl\"]\n        if \"sceneCount\" in body:\n            result[\"scene_count\"] = body[\"sceneCount\"]\n\n    return result\n"
        code_language: python3
        desc: 根据step+action计算next_step，同时提取HTTP返回体中的URL/数量字段
        outputs:
          last_answer_text:
            children: null
            type: string
          last_image_url:
            children: null
            type: string
          last_video_url:
            children: null
            type: string
          next_step:
            children: null
            type: number
          scene_count:
