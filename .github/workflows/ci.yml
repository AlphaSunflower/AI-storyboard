name: CI

on:
  push:
    branches: [master, no-dify]
  pull_request:

jobs:
  backend:
    name: Backend (Maven test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [AIStoryboardBackend, AILLMGateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Maven test
        run: mvn -B -q -f ${{ matrix.module }}/pom.xml test
      # 上传 surefire 报告（测试失败时可在 Actions 页面直接查看失败详情）
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.module }}
          path: ${{ matrix.module }}/target/surefire-reports

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: AIStoryboardClient/package-lock.json
      - name: Install deps
        working-directory: AIStoryboardClient
        run: npm ci
      - name: TypeScript typecheck
        working-directory: AIStoryboardClient
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Build
        working-directory: AIStoryboardClient
        run: npm run build
