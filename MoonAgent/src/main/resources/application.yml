server:
  port: 8084

spring:
  application:
    name: moon-agent
  profiles:
    active: local
  cloud:
    compatibility-verifier:
      enabled: false   # Boot 4.1.1 与 Spring Cloud 2025.1 官方未配对；Framework 同为 7.0.x 实机可跑，SC 出 4.1 配对车后可删
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        enabled: true
  datasource:
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
    # 注意：不用 ${DB_URL:...} 占位符——本机存在其他项目遗留的 DB_URL/DB_USERNAME/DB_PASSWORD 全局环境变量（MySQL），会被污染
    # 生产部署用 SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD 覆盖（环境变量优先级高于 yaml）
    # 本地开发凭据在 application-local.yml
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  ai:
    openai:
      base-url: ${LLM_GATEWAY_BASE_URL:http://localhost:8083}/v1
      api-key: ${LLM_GATEWAY_API_KEY:lg-df377c8084e645ffa34e0dfce1fb3e78}
      # Spring AI 2.0 默认 60s；运行期 options 仍显式设置，避免单次覆盖时回落到默认值
      timeout: 300s
      # 超时/连接失败不做 SDK 级隐式重试，避免单次 120s 超时被放大为多次串行请求
      max-retries: 0

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_uuid
      logic-delete-field: deleted

# 只暴露 health 端点（部署探活），其余 actuator 端点不外泄
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

# 主后端内部 API 地址（服务间调用）
storyboard:
  internal-url: ${STORYBOARD_INTERNAL_URL:http://localhost:8082}
  internal-secret: ${INTERNAL_SECRET:}
  # MinIO 对象存储（图片/视频/音频统一存对象存储，替代本地 uploads/）
  # 默认指向本机 MinIO（本地开发）；生产在 application-prod.yml 覆盖。
  storage:
    endpoint: ${STORYBOARD_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORYBOARD_STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORYBOARD_STORAGE_SECRET_KEY:minioadmin123}
    bucket: storyboard
    region: us-east-1

# 上传根目录：monorepo 本地指向主后端 uploads（文件共享，前端统一经主后端 /api/files/** 读取）；生产配共享存储
ai:
  upload-root: ${UPLOAD_ROOT:../AIStoryboardBackend/uploads}
  storyboard-internal-url: ${STORYBOARD_INTERNAL_URL:http://localhost:8082}   # 主后端地址：参考素材(/api/files/**) 本地缺失时经此拉取
  gateway:
    base-url: ${LLM_GATEWAY_BASE_URL:}
    api-key: ${LLM_GATEWAY_API_KEY:}

  agent:
    plan-timeout-seconds: 300
    recommend-timeout-seconds: 20
    material-timeout-seconds: 45
    intent-timeout-seconds: 10
    # 长剧本分批生成可能持续十余分钟；该值控制 MVC SSE 连接生命周期
    sse-timeout-seconds: 1200
    history-context-max-chars: 10000
    history-message-max-chars: 2000
    # 自动审查链：链首意图写库成功后自动 handoff 给 scene-review 出「分镜审查」卡（暴露缺图缺视频/补图补视频）。
    # 空数组=关闭（默认，行为与现状一致）；示例 [aisplit] 开启分镜写库后自动审查。
    auto-review-chains:
      - aisplit

  # ── 超时 / 重试（秒/毫秒，Java 默认值已对齐当前行为，仅需覆盖时取消注释）──
  image-request-timeout: 310
  image-edit-timeout: 180
  video-request-timeout: 120
  video-download-timeout: 180
  video-retry-delay-ms: 15000
  script-timeout: 300
  script-max-tokens: 8192
  gateway-model-timeout: 10
  gateway-cooldown-ms: 300000

# ── MCP Server（暴露 agent 工具给外部 MCP 客户端）──
spring.ai.mcp.server.enabled: true
spring.ai.mcp.server.name: moon-agent
spring.ai.mcp.server.version: 1.0.0
spring.ai.mcp.server.type: SYNC
spring.ai.mcp.server.protocol: STREAMABLE
# ── MCP Client（接入外部 MCP 服务器）──
spring.ai.mcp.client.enabled: true
spring.ai.mcp.client.type: SYNC
spring.ai.mcp.client.toolcallback.enabled: true

# 提示词文件目录（文件系统路径，支持热刷新）
prompts:
  dir: src/main/resources/prompts
