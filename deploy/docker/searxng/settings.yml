# deploy/docker/searxng/settings.yml
# SearXNG 实例配置（挂进容器 /etc/searxng/settings.yml）。
# 这里只写**需要覆盖**的段：官方镜像的 entrypoint 会把这层与镜像自带的默认 settings.yml 合并，
# 未列出的键（engines/plugins/outgoing 等）全部沿用官方默认。
#
# 关键一项是 search.formats 里的 json —— Moon 的 web_search 走 format=json；
# SearXNG 默认只开 html，不开 json 就会返回 403（Moon 侧会把 403 翻译成可执行的提示）。
use_default_settings: true

general:
  # 仅供 MoonAgent 服务端调用，不需要对外展示品牌信息
  instance_name: "Moon Agent Search"
  donation_url: false
  contact_url: false
  enable_metrics: false

server:
  # 由 entrypoint 用环境变量 SEARXNG_SECRET 替换；compose 里必须显式提供
  secret_key: "CHANGE_ME_BY_SEARXNG_SECRET"
  # 关闭限流器：MoonAgent 是内网同机调用，没有浏览器会话，
  # 开着会被 botdetection 判成滥用并返回 429（这是自托管最常见的第二个坑）。
  limiter: false
  public_instance: false
  image_proxy: false

search:
  # 默认语言；Moon 侧每次请求还会显式带 language 参数
  default_lang: "zh-CN"
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    # 必需：Moon 的 web_search 从这里取结构化结果
    - json

ui:
  static_use_hash: true
