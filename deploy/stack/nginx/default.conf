# 前端入口（主站 + 画布站 + /api 反代）
# 关键点：必须透传 X-Forwarded-Port/Proto，且各 Java 服务开启
# server.forward-headers-strategy=framework；否则经 nginx 访问时，画布的
# POST/PATCH/PUT 会被当成跨域请求静默返回 403（Invalid CORS request）。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 300m;
    charset utf-8;
    server_tokens off;

    # 画布站（XiaoYueCanvasAgent，vite base=/canvas/）
    location ^~ /canvas/ {
        try_files $uri /canvas/index.html;
    }

    # 统一 API 入口：/api/canvas/**、/api/library/**、/api/agent/** 由网关按直连地址转发到各服务
    location ^~ /api/ {
        set $gateway http://api-gateway:8080;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";

        # Agent SSE 长连接：关闭缓冲并放宽读超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 主站 SPA（react-router history fallback）
    # 注意：不能写 $uri/ —— dist 下存在 login/ 等静态资源目录，
    # 带尾斜杠的 /login/ 会命中目录且无 index 文件，nginx 直接返回 403。
    location / {
        try_files $uri /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
