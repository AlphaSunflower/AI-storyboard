server:
  port: 9090
  servlet:
    context-path: /api/canvas

spring:
  application:
    name: xiaoyue-canvas
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  cloud:
    compatibility-verifier:
      enabled: false   # Boot 4.1.1 与 Spring Cloud 2025.1 官方未配对；Framework 同为 7.0.x 实机可跑，SC 出 4.1 配对车后可删
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        enabled: true
  datasource:
    driver-class-name: org.postgresql.Driver
    # 注意：不用 ${DB_URL:...} 占位符（本机存在其他项目遗留的 DB_URL/DB_USERNAME/DB_PASSWORD 全局环境变量指向 MySQL，会被污染）
    # 本地开发凭据/库名在此；生产用 SPRING_DATASOURCE_* 环境变量覆盖（优先级高于 yaml）
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ai_storyboard}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
  servlet:
    multipart:
      max-file-size: 256MB
      max-request-size: 256MB
  ai:
    openai:
      # 统一走 LLM 网关 8083（Spring AI 自动拼 /chat/completions、/images/generations 等）
      base-url: ${LLM_GATEWAY_BASE_URL:http://localhost:8083}/v1
      api-key: ${LLM_GATEWAY_API_KEY:}
      # 画布长任务允许模型在单次请求内运行长时间工具循环
      timeout: 3600s
      max-retries: 0

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_uuid
      logic-delete-field: deleted

# 上传根目录：复用主后端 uploads（文件共享，前端经主后端 /api/files/** 或本文 /assets/{id} 读取）
ai:
  upload-root: ${UPLOAD_ROOT:../AIStoryboardBackend/uploads}
  gateway:
    base-url: ${LLM_GATEWAY_BASE_URL:}
    api-key: ${LLM_GATEWAY_API_KEY:}
  # ── 超时/重试（默认值对齐 agent-core 行为）──
  image-request-timeout: 900
  image-edit-timeout: 900
  # 必须晚于网关上游请求超时（默认 600s）：避免上游已受理、画布先超时导致 taskId 丢失。
  video-request-timeout: 1200
  video-download-timeout: 900
  video-retry-delay-ms: 15000
  gateway-model-timeout: 30
  gateway-cooldown-ms: 300000

# 跨域：dev 靠 vite proxy，生产走网关统一 CORS
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
