          provider: langgenius/deepseek/deepseek
        prompt_template:
        - id: c1d23bf5-35ed-4fc0-b5c9-54916957189f
          role: system
          text: '结合用户当前输入 + 全部历史对话记录 + 是否携带参考图，识别用户意图：


            意图分类（四类）：

            - intent-aisplit = 剧本/分镜制作：用户提供剧本、故事、文案，要求生成分镜脚本/故事板，或对剧本、分镜方案进行优化完善

            - intent-pic = 全新图片生成，或对已有图片的修改/完善（更亮/换风格/改构图/去掉某元素/继续完善/不满意等，或携带参考图且内容是修改诉求）

            - intent-video = 视频生成：用户要求生成短视频、动画片段，或设计视频方案

            - intent-other = 打招呼、闲聊、询问功能等非创作需求


            判断规则：

            1. 明确意图词优先：剧本/分镜/故事板 → intent-aisplit；视频/动画/短片 → intent-video；图片/海报/插画
            → intent-pic

            2. 用户说"继续/接着上次"时，结合历史对话判断：在完善分镜 → intent-aisplit；在完善图片 → intent-pic

            3. 分镜相关"优化/完善剧本"也归 intent-aisplit（剧本优化设计分支处理）

            4. 无法明确区分时，message 引导用户："你希望 AI 分镜、图片生成还是视频生成呢？"

            5. message 字段：创作类意图给一句简短执行确认语（如"好的，开始设计分镜方案"）；intent-other 类给自然回复


            4种输出格式如下（只输出纯 JSON）：

            {"type":"intent-aisplit","message":"回复内容"}、

            {"type":"intent-pic","message":"回复内容"}、

            {"type":"intent-video","message":"回复内容"}、

            {"type":"intent-other","message":"回复内容"}'
        reasoning_format: tagged
        selected: false
        structured_output:
          schema:
            additionalProperties: false
            properties:
              message:
                description: 回复用户的内容
                enum: null
                type: string
              type:
                description: intent-aisplit → 剧本(分镜)优化设计 intent-pic → 图片方案设计 intent-video
                  → 视频方案设计  intent-other → 引导回复
                enum:
                - intent-aisplit
                - intent-pic
                - intent-video
                - intent-other
                type: string
            required:
            - message
            - type
            type: object
        structured_output_enabled: true
        title: 意图识别
        type: llm
        vision:
          enabled: false
