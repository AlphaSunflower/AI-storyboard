# 单 JVM 全栈入口（公网测试版）：静态站 + /api 反代 + 关闭注册
#
# 与 deploy/stack/nginx/default.conf 的差别：
#   1. 上游从 api-gateway:8080 换成 allinone:8080（6 个服务在同一个容器/同一个 JVM 里）
#   2. 显式拦掉 POST /api/auth/register —— 不改后端任何注册代码，只在入口层关闭注册
#   3. 增加基础安全响应头（公网可达）
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 300m;
    charset utf-8;

    # 关闭目录列表 / 版本号
    autoindex off;
    server_tokens off;

    # ── 注册关闭（部署层控制，后端注册接口代码保持不变）────────────────
    # 精确匹配优先于前缀匹配，因此这条一定先命中。
    location = /api/auth/register {
        default_type application/json;
        access_log off;
        return 403 '{"code":40301,"message":"本环境不开放注册，请使用已有账号登录"}';
    }

    # 画布站（XiaoYueCanvasAgent，vite base=/canvas/）
    location ^~ /canvas/ {
        try_files $uri /canvas/index.html;
    }

    # 统一 API 入口：/api/canvas/**、/api/library/**、/api/agent/** 由网关按直连地址转发到各服务
    location ^~ /api/ {
        set $gateway http://allinone:8080;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 必须转发原始端口：各服务跑在 8080/8082/…/9090，Spring 默认用连接器端口(如 9090)
        # 跟浏览器 Origin 里的端口(80)比较，同源的 POST/PATCH/PUT 会被误判成跨域 →
        # canvas 的 CORS 白名单不含该 Origin 时静默回 403。加上它 + 各服务
        # server.forward-headers-strategy=framework 才能从根上避免。
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";

        # Agent SSE 长连接：关闭缓冲并放宽读超时（2 核机器上长任务更慢）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 主站 SPA（react-router history fallback）
    # 注意：不能写 $uri/ —— dist 下存在 login/ 等静态资源目录，
    # 带尾斜杠的 /login/ 会命中目录且无 index 文件，nginx 直接返回 403。
    location / {
        try_files $uri /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
