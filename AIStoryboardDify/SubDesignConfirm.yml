app:
  description: 'LLM生成方案 → 用户反馈 → 修改或通过 的设计-确认交互循环。封装为可复用子工作流，供主工作流调用。'
  icon: 🔄
  icon_background: '#E3EFFF'
  icon_type: emoji
  mode: advanced-chat
  name: SubDesignConfirm
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/deepseek:0.0.19@5b68617c637b62d31e7f33a9f5677b76e88f81868fb04a728e208588564b72ea
    version: null
kind: app
version: 0.7.0
workflow:
  # ============================================================
  # 会话变量：父工作流传入的上下文数据
  # ============================================================
  conversation_variables:
  - description: 当前设计的系统提示词（由父工作流在调用子工作流前设置）
    id: 0a1b2c3d-0001-4000-a000-000000000001
    name: script_prompt
    selector:
    - conversation
    - script_prompt
    value: ''
    value_type: string
  - description: '-1: 初始, 1: 分镜方案, 3: 图片方案, 4: 视频方案 —— 父工作流据此判断当前所处的设计阶段'
    id: 0a1b2c3d-0002-4000-a000-000000000002
    name: step
    selector:
    - conversation
    - step
    value: -1
    value_type: integer
  - description: 当前操作的项目ID
    id: 0a1b2c3d-0003-4000-a000-000000000003
    name: currentProjectId
    selector:
    - conversation
    - currentProjectId
    value: ''
    value_type: string
  - description: 最近对话历史记录（array of strings）
    id: 0a1b2c3d-0004-4000-a000-000000000004
    name: historytalk
    selector:
    - conversation
    - historytalk
    value: []
    value_type: array[string]
  environment_variables: []
  # ============================================================
  # 应用配置
  # ============================================================
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods: []
      number_limits: 3
    opening_statement: '请描述你想要的设计方案，我将为你生成。'
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  # ============================================================
  # 图：节点 + 边
  # ============================================================
  graph:
    edges:
    # ---- start → LLM ----
    - data:
        isInIteration: false
        isInLoop: false
        iteration_id: null
        loop_id: null
        sourceType: start
        targetType: llm
      id: start-to-llm
      selected: false
      source: start-node
      sourceHandle: source
      target: llm-design
      targetHandle: target
      type: custom
      zIndex: 0
    # ---- LLM → answer（输出方案，等待用户反馈） ----
    - data:
        isInIteration: false
        isInLoop: false
        iteration_id: null
        loop_id: null
        sourceType: llm
        targetType: answer
      id: llm-to-answer-output
      selected: false
      source: llm-design
      sourceHandle: source
      target: answer-output
      targetHandle: target
      type: custom
      zIndex: 0
    # ---- answer → if-else（用户下一轮消息进入意图判断） ----
    - data:
        isInIteration: false
        isInLoop: false
        iteration_id: null
        loop_id: null
        sourceType: answer
        targetType: if-else
      id: answer-to-router
      selected: false
      source: answer-output
      sourceHandle: source
      target: confirm-router
      targetHandle: target
      type: custom
      zIndex: 0
    # ---- if-else 批准分支 → answer（确认消息，子工作流结束） ----
    - data:
        isInIteration: false
        isInLoop: false
        iteration_id: null
        loop_id: null
        sourceType: if-else
        targetType: answer
      id: router-approved-to-answer
      selected: false
      source: confirm-router
      sourceHandle: case-approved
      target: answer-approve
      targetHandle: target
      type: custom
      zIndex: 0
    # ---- if-else 跳过分支 → answer（跳过消息，子工作流结束） ----
    - data:
        isInIteration: false
        isInLoop: false
        iteration_id: null
        loop_id: null
        sourceType: if-else
        targetType: answer
      id: router-skip-to-answer
      selected: false
      source: confirm-router
      sourceHandle: case-skip
      target: answer-skip
      targetHandle: target
      type: custom
      zIndex: 0
    # ---- if-else 修改分支 / 默认 → LLM（回到LLM重新生成方案） ----
    # 注：此边创建图的循环，但因 answer-output 节点会暂停等待用户输入，
    # 行程的实际上是"用户输入 → LLM → 输出 → 等待 → 用户输入 → ..." 的交互循环
    - data:
        isInIteration: false
        isInLoop: false
        iteration_id: null
        loop_id: null
        sourceType: if-else
        targetType: llm
      id: router-false-to-llm
      selected: false
      source: confirm-router
      sourceHandle: 'false'
      target: llm-design
      targetHandle: target
      type: custom
      zIndex: 0

    nodes:
    # ========================================
    # 节点 1: start — 标准 Chatflow 入口
    # ========================================
    - data:
        selected: false
        title: 开始
        type: start
        variables: []
      height: 108
      id: start-node
      position:
        x: 80
        y: 300
      positionAbsolute:
        x: 80
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0

    # ========================================
    # 节点 2: llm — 生成设计方案
    # 使用 conversation.script_prompt 作为系统提示词
    # 结合当前 project 的分镜数据生成方案
    # 同时输出 type 字段供 if-else 判断用户意图
    # ========================================
    - data:
        context:
          enabled: true
          variable_selector:
          - conversation
          - historytalk
        memory:
          query_prompt_template: '{{#sys.query#}}

            {{#sys.files#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: true
            size: 50
        model:
          completion_params:
            temperature: 0.7
          mode: chat
          name: deepseek-chat
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - id: design-system-prompt
          role: system
          text: '{{#conversation.script_prompt#}}

            额外规则：
            - 每次输出方案后，必须在结构化输出中标记 type 字段
            - type="modify"：用户需要修改方案（默认值，新生成或用户提出修改意见时）
            - type="approved"：用户明确表示认可、满意（如：可以/满意/继续/OK/yes/通过/好的/没问题）
            - type="skip"：用户表示跳过当前设计步骤（如：跳过/不用/不要/skip）
            - 当用户只是闲聊或询问时，先友好回应再继续推进方案

            输出格式（JSON）：
            {"type":"modify|approved|skip", "message":"完整回复内容"}'
        selected: false
        structured_output:
          schema:
            additionalProperties: false
            properties:
              message:
                description: 回复用户的完整内容（包含设计方案或确认消息）
                type: string
              type:
                description: 用户意图：modify=需修改, approved=已批准, skip=跳过
                enum:
                - modify
                - approved
                - skip
                type: string
            required:
            - type
            - message
            type: object
        structured_output_enabled: true
        title: LLM生成方案
        type: llm
        vision:
          enabled: false
      height: 87
      id: llm-design
      position:
        x: 450
        y: 300
      positionAbsolute:
        x: 450
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 241
      zIndex: 0

    # ========================================
    # 节点 3: answer — 输出LLM生成的方案给用户
    # 同时作为循环断点：用户下一轮消息→if-else
    # ========================================
    - data:
        answer: '{{#llm-design.structured_output.message#}}'
        selected: false
        title: 输出方案
        type: answer
        variables: []
      height: 136
      id: answer-output
      position:
        x: 820
        y: 300
      positionAbsolute:
        x: 820
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 241
      zIndex: 0

    # ========================================
    # 节点 4: if-else — 判断用户意图，路由到不同分支
    # - 批准分支: type="approved" → 确认出口
    # - 跳过分支: type="skip" → 跳过出口
    # - 修改分支 (false/default): → 回到LLM重新生成
    # ========================================
    - data:
        cases:
        # 批准分支：用户认可方案
        - case_id: case-approved
          conditions:
          - comparison_operator: '='
            id: cond-approved
            value: approved
            varType: string
            variable_selector:
            - llm-design
            - structured_output
            - type
          id: case-approved
          logical_operator: and
        # 跳过分支：用户跳过当前设计
        - case_id: case-skip
          conditions:
          - comparison_operator: '='
            id: cond-skip
            value: skip
            varType: string
            variable_selector:
            - llm-design
            - structured_output
            - type
          id: case-skip
          logical_operator: and
        selected: false
        title: 确认/修改/跳过路由
        type: if-else
      height: 195
      id: confirm-router
      position:
        x: 1190
        y: 240
      positionAbsolute:
        x: 1190
        y: 240
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 241
      zIndex: 0

    # ========================================
    # 节点 5: answer — 批准出口
    # 当用户认可方案时，输出确认消息，子工作流结束
    # ========================================
    - data:
        answer: '✅ 方案已确认！{{#llm-design.structured_output.message#}}'
        selected: false
        title: 确认通过
        type: answer
        variables: []
      height: 136
      id: answer-approve
      position:
        x: 1560
        y: 180
      positionAbsolute:
        x: 1560
        y: 180
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 241
      zIndex: 0

    # ========================================
    # 节点 6: answer — 跳过出口
    # 当用户选择跳过时，输出提示消息，子工作流结束
    # ========================================
    - data:
        answer: ⏭️ 已跳过当前设计步骤。进入下一步。
        selected: false
        title: 跳过
        type: answer
        variables: []
      height: 136
      id: answer-skip
      position:
        x: 1560
        y: 380
      positionAbsolute:
        x: 1560
        y: 380
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 241
      zIndex: 0

    viewport:
      x: 0
      y: 0
      zoom: 1
  rag_pipeline_variables: []
