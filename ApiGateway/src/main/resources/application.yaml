server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  profiles:
    active: local
  cloud:
    compatibility-verifier:
      enabled: false   # Boot 4.1.1 与 Spring Cloud 2025.1 官方未配对；Framework 同为 7.0.x 实机可跑，SC 出 4.1 配对车后可删
    gateway:
      server:
        webmvc:
          # gateway-server-webmvc 变体：配置前缀与 WebFlux 版不同，predicates 为 name+args 对象结构
          routes:
            # 上游地址默认直连（compose 里覆盖成服务名，本机开发用 localhost）。
            # 要恢复 Nacos 服务发现：设 NACOS_DISCOVERY_ENABLED=true，
            # 并把四个 *_URI 指回 lb://moon-agent / lb://asset-service / lb://xiaoyue-canvas / lb://ai-storyboard
            # Agent 服务
            - id: moon-agent
              uri: "${MOON_AGENT_URI:http://localhost:8084}"
              predicates:
                - name: Path
                  args:
                    patterns: /api/agent/**
            # 独立资产服务
            - id: asset-service
              uri: "${ASSET_SERVICE_URI:http://localhost:8085}"
              predicates:
                - name: Path
                  args:
                    patterns: /api/library/**
            # 画布服务
            - id: xiaoyue-canvas
              uri: "${CANVAS_URI:http://localhost:9090}"
              predicates:
                - name: Path
                  args:
                    patterns: /api/canvas/**
            # 主后端
            - id: ai-storyboard
              uri: "${BACKEND_URI:http://localhost:8082}"
              predicates:
                - name: Path
                  args:
                    patterns: /api/auth/**,/api/projects/**,/api/scenes/**,/api/files/**,/api/assets/**,/api/ai/**,/api/user/**
    # Nacos 服务发现（默认关闭：不注册、不走发现，路由按上面的直连地址）
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        enabled: ${NACOS_DISCOVERY_ENABLED:false}

# JWT 配置（与主后端共享 secret）
jwt:
  access-secret: ${JWT_ACCESS_SECRET:}
  issuer: ${JWT_ISSUER:ai-storyboard-backend}

# 内部服务调用密钥（Agent → 主后端 /api/internal/* 共享）
internal:
  secret: ${INTERNAL_SECRET:}
