spring:
  application:
    name: ai-storyboard
  profiles:
    active: local            # 默认本地环境；生产用 --spring.profiles.active=prod 覆盖
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  datasource:
    driver-class-name: org.postgresql.Driver

server:
  port: 8082

# 只暴露 health 端点（部署探活），其余 actuator 端点不外泄
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_uuid
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  issuer: newworkflow-backend
  access-token-ttl: 7200
  refresh-token-ttl: 2592000

# ═══════════════════════════════════════════════════
# AI 配置 —— 模型路由提示 + 文件存储（无密钥）
# 默认模型/参数、模型路由已下沉 LLM 网关（model_route + model_params 表）
# 数据源 / JWT 密钥 / 网关地址与 Key 在各 profile 文件：
#   application-local.yml（本地） / application-prod.yml（生产）
# ═══════════════════════════════════════════════════
ai:
  # Agent 编排行为参数（意图阈值 / 澄清上限；代码默认值见 AgentAiConfigProperties，yml 覆盖）
  agent:
    intent-threshold: 0.6
    max-clarify-rounds: 2
    max-regenerate-rounds: 3

  # ── LLM 网关兜底策略 ──
  # 当网关不可达或未标记 is_default 时，以下值作为文本模型的兜底默认值。
  # fallback-text-api-key 为兜底模型的独立 API Key（网关正常时由网关统一管理密钥，
  # 仅当网关完全不可达且需直连模型厂商时才使用此 key）。
  gateway:
    fallback-text-model: deepseek-v4-flash
    fallback-text-api-key: ${LLM_GATEWAY_API_KEY:}

  # ── 文件存储（与上游无关，纯本地路径）──
  video-upload-dir: uploads/videos
  video-file-extension: .mp4
  video-url-prefix: /api/files/videos/
