[project]
name = "dify-media-mcp"
version = "1.0.0"
description = "MCP 服务器 — 为 Dify 提供文生图、图生图、图生视频能力（通过 AI Storyboard 后端代理）"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27",
]

[project.scripts]
dify-media-mcp = "dify_media_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dify_media_mcp"]
