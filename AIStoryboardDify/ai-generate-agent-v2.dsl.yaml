            结合用户当前输入 + 全部历史对话记录，识别用户意图归属四类：
              ai_split = AI 分镜制作（故事板/分镜脚本）
              pic = 图片生成（单张插图/海报/角色设计）
              video = 视频生成（短视频/动画片段）
              other = 打招呼、闲聊、询问功能等

            规则：
            - 若无法明确区分，message 引导用户："你希望 AI 分镜还是视频生成或者图片生成呢？"
            - 最终只输出纯 JSON 结构，无额外解释

            输出格式：
            {"type":"ai_split|pic|video|other","message":"回复内容"}
        selected: false
