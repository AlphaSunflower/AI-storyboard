spring:
  application:
    name: llm-gateway
  profiles:
    active: local            # 默认本地环境；生产用 --spring.profiles.active=prod 覆盖
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  datasource:
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# MCP Server: expose gateway media tools to MoonAgent at /mcp
spring.ai.mcp.server.enabled: true
spring.ai.mcp.server.name: llm-gateway-media
spring.ai.mcp.server.version: 1.0.0
spring.ai.mcp.server.type: SYNC
spring.ai.mcp.server.protocol: STREAMABLE
server:
  port: 8083

# 只暴露 health 端点（部署探活），其余 actuator 端点不外泄
management:
  endpoints:
    web:
      exposure:
        include: health

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_uuid
      logic-delete-field: deleted
      logic-delete-value: true      # BOOLEAN 列，不能用 1/0（实测踩坑）
      logic-not-delete-value: false

gateway:
  vendor:
    doubao:
      # 外部统一调用 /v1/images/edits；豆包 Seedream 在此转换成方舟原生图片路径
      image-edit-path: ${DOUBAO_IMAGE_EDIT_PATH:/images/generations}
  jwt:
    issuer: llm-gateway
    access-token-ttl: 3600
    refresh-token-ttl: 2592000

# 主平台网关令牌验签密钥（与主后端 JWT_ACCESS_SECRET 一致；留空则关闭该通道）
platform:
  jwt:
    access-secret: ${PLATFORM_JWT_ACCESS_SECRET:}
